<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>A/B Compare — מחזור משכנתא | מניפה</title>
<style>
  :root{--ink:#0E3C5C;--accent:#5BAFD8;--gold:#C4A574}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Heebo,system-ui,sans-serif;background:#0A2F48;color:#E8F4FA;min-height:100vh}
  header{padding:16px 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(91,175,216,.25)}
  h1{font-size:1.15rem;font-weight:700}
  .links{display:flex;flex-wrap:wrap;gap:8px}
  .links a{color:#071E2E;background:var(--accent);padding:8px 12px;border-radius:999px;text-decoration:none;font-weight:700;font-size:.85rem}
  .links a.ghost{background:transparent;color:#E8F4FA;border:1px solid rgba(232,244,250,.35)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:0;height:calc(100vh - 64px)}
  .pane{display:flex;flex-direction:column;border-inline-start:1px solid rgba(91,175,216,.2)}
  .pane h2{font-size:.9rem;padding:10px 14px;background:#071E2E;color:var(--gold);font-weight:600}
  iframe{flex:1;width:100%;border:0;background:#fff}
  @media(max-width:900px){.grid{grid-template-columns:1fr;height:auto}.pane{height:70vh}}
</style>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
<header>
  <h1>A/B · מחזור משכנתא — אותו קופי, שני מערכות עיצוב</h1>
  <div class="links">
    <a href="variant-a-menifa-skill/" target="_blank">פתח A</a>
    <a href="variant-b-chain/" target="_blank">פתח B</a>
    <a class="ghost" href="COMPARE.md" target="_blank">COMPARE.md</a>
  </div>
</header>
<div class="grid">
  <div class="pane">
    <h2>A — Menifa skill (עיצוב ועריכה מניפה)</h2>
    <iframe src="variant-a-menifa-skill/" title="Variant A"></iframe>
  </div>
  <div class="pane">
    <h2>B — Taste · Emil · Impeccable · Playwright</h2>
    <iframe src="variant-b-chain/" title="Variant B"></iframe>
  </div>
</div>
</body>
</html>
