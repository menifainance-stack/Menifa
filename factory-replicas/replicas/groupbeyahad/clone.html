<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta name="robots" content="noindex,nofollow,noarchive" />

<meta charset="UTF-8" />
<meta name="viewport" content="width=1280" />
<title>קבוצת ביחד פיננסים</title>
<style>
  @font-face {
    font-family: AbsoluticaCon;
    font-weight: 900;
    src: url("fonts/Absolutica-Black.woff2") format("woff2");
  }
  @font-face {
    font-family: AbsoluticaCon;
    font-weight: 500;
    src: url("fonts/Absolutica-Medium.woff2") format("woff2");
  }
  @font-face {
    font-family: AbsoluticaCon;
    font-weight: 400;
    src: url("fonts/Absolutica-Regular.woff2") format("woff2");
  }
  :root {
    --navy: #21223D;
    --navy-card: #2B2C46;
    --accent: #D7B56D;
    --text: #121732;
    --white: #FFFFFF;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1280px; height: 800px; overflow: hidden;
    font-family: AbsoluticaCon, Assistant, Heebo, Arial, sans-serif;
    direction: rtl; background: #fff; color: var(--text);
  }
  .top {
    height: 92px; display: flex; align-items: center; justify-content: center;
    background: #fff;
  }
  .top img { height: 58px; width: auto; object-fit: contain; }
  .card {
    margin: 0 28px;
    background: var(--navy);
    border-radius: 32px 32px 0 0;
    min-height: 708px;
    padding: 22px 56px 20px;
    color: #fff;
    text-align: center;
  }
  .as-seen {
    font-size: 15px; font-weight: 400; opacity: .92; margin-bottom: 10px;
  }
  .media {
    display: flex; justify-content: center; align-items: center;
    margin: 0 auto 18px;
    max-width: 520px;
  }
  .media img {
    width: 100%; height: auto; border-radius: 14px; display: block;
    background: rgba(255,255,255,.06);
  }
  h1 {
    font-weight: 900; font-size: 38px; line-height: 1.32;
    max-width: 900px; margin: 0 auto 14px; letter-spacing: -0.01em;
  }
  .watch {
    color: var(--accent); font-weight: 500; font-size: 20px;
    margin-bottom: 16px;
  }
  .video-wrap {
    position: relative;
    width: 680px; max-width: 100%;
    margin: 0 auto;
    border-radius: 16px; overflow: hidden;
    aspect-ratio: 16 / 9;
    background: #1a1b2e;
    box-shadow: 0 12px 40px rgba(0,0,0,.35);
  }
  .video-wrap img {
    width: 100%; height: 100%; object-fit: cover; display: block;
  }
  .play {
    position: absolute; left: 50%; top: 46%; transform: translate(-50%,-50%);
    width: 86px; height: 64px; border-radius: 12px;
    background: rgba(215,181,109,.88);
    display: grid; place-items: center;
    color: #1a1b2e; font-size: 26px; font-weight: 900;
    box-shadow: 0 4px 18px rgba(0,0,0,.25);
  }
  .mute {
    position: absolute; top: 12px; right: 12px;
    width: 36px; height: 36px; border-radius: 50%;
    background: rgba(0,0,0,.55); display: grid; place-items: center; font-size: 14px;
  }
  .subs {
    position: absolute; left: 0; right: 0; bottom: 14px;
    text-align: center; font-size: 15px; font-weight: 700;
    text-shadow: 0 1px 3px rgba(0,0,0,.85);
  }
  .sb {
    position: absolute; top: 0; right: 0; width: 15px; height: 800px; z-index: 40;
    background: #CECECE;
  }
  .sb i { position: absolute; top: 96px; right: 3px; width: 9px; height: 120px; background: #8B8B8B; border-radius: 8px; }
</style>
</head>
<body>
<div class="top">
  <img src="assets/logo-from-evidence.png" alt="קבוצת ביחד" />
</div>
<section class="card">
  <div class="as-seen">כפי שסוקר ב-</div>
  <div class="media"><img src="assets/media-strip-evidence.png" alt="כפי שסוקר" /></div>
  <h1>הפתרון המוכח שעזר ל-10,274+ בעלי נכס עם משכנתא וריבוי הלוואות<br />לעצור את הלחץ הכלכלי ולהקטין את<br />כל ההחזרים ב-50% תוך 30 יום</h1>
  <div class="watch">👇 צפו וגלו איך עובד התהליך 👇</div>
  <div class="video-wrap">
    <img src="assets/video-from-evidence.png" alt="ריסטארט פיננסי" />
  </div>
</section>
<div class="sb"><i></i></div>
</body>
</html>
