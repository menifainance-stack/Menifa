name: SEO — סנכרון פידים ודחיפה לאינדוקס

# רץ אוטומטית בכל פרסום מאמר או עדכון דף.
# 1. מריץ את tools/regen_seo.py — בונה מחדש sitemap/rss/llms מהקבצים עצמם
# 2. מקומיט את השינוי אם משהו השתנה
# 3. דוחף את כל כתובות ה-sitemap ל-IndexNow (Bing, Yandex, Seznam, Naver)
#
# הערה: לגוגל אין יותר endpoint ל-ping (הוסר ב-2023). הדרך לגוגל היא
# sitemap טרי ב-Search Console — ולכן שלב 1 הוא הקריטי.

on:
  push:
    branches: [main]
    paths:
      - 'blog/**'
      - '*.html'
  workflow_dispatch:

# actions: write is only the ceiling for the job below. GitHub rejects a job
# that requests a scope the workflow permissions omit. No other scope.
permissions:
  contents: write
  actions: write

concurrency:
  group: seo-autoindex
  cancel-in-progress: false

jobs:
  sync-and-index:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: בניית פידים מחדש
        # regen_seo.py refuses to write feeds when canonical / hreflang /
        # og:url / BreadcrumbList still point at github.io.
        run: python3 tools/regen_seo.py

      - name: קומיט אם השתנה משהו
        id: sync
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "אין שינוי בפידים."
            exit 0
          fi
          git config user.name  "Menifa SEO Bot"
          git config user.email "menifainance@gmail.com"
          git add sitemap.xml sitemap-pages.xml sitemap-index.xml rss.xml llms.txt index.html
          git commit -m "SEO: סנכרון אוטומטי של sitemap, RSS ו-llms.txt"
          git push
          echo "changed=true" >> $GITHUB_OUTPUT

      - name: דחיפת כל הכתובות ל-IndexNow
        run: python3 tools/push_indexnow.py

      - name: אימות שהפידים חיים ומכילים את המאמר החדש
        # רץ אחרי שה-Pages הספיק לפרוס. בודק תוכן ולא רק קוד סטטוס —
        # sitemap שמחזיר 200 אבל חסר את המאמר האחרון הוא בדיוק הבאג
        # שהאוטומציה הזו נועדה למנוע.
        # כישלון כאן לא מפיל את הריצה: הדחיפה כבר יצאה.
        continue-on-error: true
        run: |
          sleep 90
          for path in sitemap.xml rss.xml menifa-indexnow-2026070100.txt; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://menifa.org/$path")
            echo "$path -> HTTP $code"
          done

          # המאמר החדש ביותר הוא הפריט הראשון ב-rss.xml שנבנה כאן,
          # בכתובת מקודדת (slug עברי), בדיוק כפי שהיא מופיעה ב-sitemap.
          newest=$(grep -o -m1 '<link>[^<]*/blog/[^<]*</link>' rss.xml \
                   | sed 's|<link>||; s|</link>||')
          echo "המאמר החדש ביותר במאגר: $newest"
          if curl -s "https://menifa.org/sitemap.xml" | grep -q "$newest"; then
            echo "✓ $newest נמצא ב-sitemap החי"
          else
            echo "✗ $newest חסר מה-sitemap החי — ייתכן שהפריסה עוד לא הסתיימה"
          fi

      # A GITHUB_TOKEN push does not start other workflows. After this job
      # actually pushes a commit to main, workflow_dispatch is allowed and
      # starts pages-artifact.yml. That workflow does not push, so this
      # workflow is not started again. !cancelled() lets the dispatch run
      # when an earlier step failed after the push already landed.
      - name: הפעלת פריסת Pages אחרי קומיט ל-main
        if: (!cancelled() && steps.sync.outputs.changed == 'true' && github.ref == 'refs/heads/main')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages-artifact.yml --ref main
