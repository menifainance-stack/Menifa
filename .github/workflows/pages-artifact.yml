name: Pages artifact

# The deploy job DOES publish to production on a push to main and on
# workflow_dispatch when the ref is main. While Pages Source is
# "Deploy from a branch", that publish races the legacy branch build:
# the later of the two is what menifa.org serves. A pull_request run
# builds and leak-checks only. The deploy job does not run on
# pull_request. This workflow does not change Pages settings.
# Switching Source to GitHub Actions needs Tamir's yes.
# Build and deploy use separate concurrency groups so a pull request
# cannot cancel a queued deploy on main.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: pages-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Assemble clean site directory
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site

          copy_file() {
            local src="$1"
            mkdir -p "_site/$(dirname -- "$src")"
            cp -a -- "$src" "_site/$src"
          }

          # Explicit allowlist. A path that does not match is not staged.
          # Root: HTML (including google*.html), CNAME, .nojekyll, robots.txt,
          # the sitemap XML files, rss.xml, llms.txt, llms-full.txt,
          # menifa-indexnow-*.txt, a 32-hex verification txt, BingSiteAuth.xml.
          shopt -s nullglob
          for f in *.html CNAME .nojekyll robots.txt \
              sitemap.xml sitemap-pages.xml sitemap-index.xml \
              rss.xml llms.txt llms-full.txt \
              menifa-indexnow-*.txt BingSiteAuth.xml
          do
            if [ -f "$f" ]; then
              copy_file "$f"
            fi
          done
          for f in *.txt; do
            if [[ "$f" =~ ^[0-9a-f]{32}\.txt$ ]]; then
              copy_file "$f"
            fi
          done
          shopt -u nullglob

          # assets/, blog/, lp/, q/, mockups/ — site extensions only.
          # txt there is only the font license that already ships (OFL.txt).
          # assets/lead-capture.js and assets/tco-lead.js are not staged.
          for dir in assets blog lp q mockups; do
            if [ ! -d "$dir" ]; then
              continue
            fi
            while IFS= read -r -d '' src; do
              rel="${src#./}"
              case "$rel" in
                assets/lead-capture.js|assets/tco-lead.js) continue ;;
              esac
              base="${rel##*/}"
              case "$base" in
                .*) continue ;;
              esac
              ext="${base##*.}"
              ext_lc=$(printf '%s' "$ext" | tr '[:upper:]' '[:lower:]')
              case "$ext_lc" in
                html|css|js|json|svg|png|jpg|jpeg|webp|avif|ico|woff|woff2|xml|webmanifest)
                  copy_file "$rel"
                  ;;
                txt)
                  if [ "$base" = "OFL.txt" ]; then
                    copy_file "$rel"
                  fi
                  ;;
              esac
            done < <(find "$dir" -type f -print0)
          done

          echo "files=$(find _site -type f | wc -l)"
          echo "html=$(find _site -type f -name '*.html' | wc -l)"

      - name: Fail if the staged tree leaks a non-site path
        shell: bash
        run: |
          set -euo pipefail
          leaked=0
          while IFS= read -r -d '' f; do
            echo "forbidden extension leaked: ${f#_site/}"
            leaked=1
          done < <(find _site -type f \( \
            -iname '*.md' -o -iname '*.py' -o -iname '*.mjs' -o \
            -iname '*.csv' -o -iname '*.yml' -o -iname '*.yaml' \
            \) -print0)

          for d in social docs tools tests .github scripts; do
            if [ -e "_site/$d" ]; then
              echo "forbidden directory leaked: $d"
              leaked=1
            fi
          done

          for f in CLAUDE.md README.md DATA_SOURCE_OF_TRUTH.md \
              vercel.json redirects.csv .gitignore .vercelignore \
              1.jpeg assets/lead-capture.js assets/tco-lead.js
          do
            if [ -e "_site/$f" ]; then
              echo "forbidden file leaked: $f"
              leaked=1
            fi
          done

          while IFS= read -r -d '' f; do
            rel="${f#_site/}"
            if [ "$rel" = ".nojekyll" ]; then
              continue
            fi
            echo "dotfile leaked: $rel"
            leaked=1
          done < <(find _site -name '.*' -print0)

          if [ "$leaked" -ne 0 ]; then
            echo "leak check failed"
            exit 1
          fi
          echo "clean: leak check passed"

      - name: Fail if a required public file is missing
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for f in CNAME .nojekyll robots.txt sitemap.xml sitemap-pages.xml sitemap-index.xml llms.txt llms-full.txt rss.xml assets/data/boi-mortgage-averages.json; do
            if [ ! -f "_site/$f" ]; then
              echo "missing required public file: $f"
              missing=1
            fi
          done
          # Repo-root verification files must be copied. ads.txt is required
          # only when the repo actually has one (it does not today).
          shopt -s nullglob
          for f in google*.html *verification* BingSiteAuth.xml facebook-domain-verification* menifa-indexnow-*.txt a7f3b2c8e9d14f6a8b5c2e9f1d3a7b4e.txt ads.txt; do
            if [ -f "$f" ] && [ ! -f "_site/$f" ]; then
              echo "missing verification or ads file: $f"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "required public files present"
          find _site -type f | sed 's|^_site/||' | sort

      # upload-pages-artifact v3.0.1 archives with tar and keeps dotfiles.
      # v4 and v5 exclude them unless include-hidden-files is true, which
      # would drop .nojekyll. This step mirrors the v3 archive command.
      - name: Confirm the Pages tar keeps CNAME and .nojekyll
        shell: bash
        run: |
          set -euo pipefail
          tar --directory _site -cf /tmp/pages-check.tar --exclude=.git --exclude=.github .
          tar -tf /tmp/pages-check.tar > /tmp/pages-check.list
          grep -qx './.nojekyll' /tmp/pages-check.list
          grep -qx './CNAME' /tmp/pages-check.list
          if grep -Ei '(^|/)[^/]*\.(md|py|mjs|csv|yml|yaml)$|(^|/)(docs|social|\.github|tools|scripts|tests)(/|$)|^\./(CLAUDE\.md|README\.md|DATA_SOURCE_OF_TRUTH\.md|vercel\.json|redirects\.csv|1\.jpeg)$|^\./assets/(lead-capture|tco-lead)\.js$' /tmp/pages-check.list; then
            echo "excluded path inside the Pages tar"
            exit 1
          fi
          dots=$(grep -E '(^|/)\.[^/]+$' /tmp/pages-check.list | grep -v -x './.nojekyll' || true)
          if [ -n "$dots" ]; then
            echo "dotfile other than .nojekyll inside the Pages tar"
            printf '%s\n' "$dots"
            exit 1
          fi

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site
          retention-days: 14

  deploy:
    needs: build
    # pull_request must never deploy. Publish only from main.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
