  }
  .top-freeze {
    position: absolute; left: 0; top: 0; width: 1280px; height: 96px;
    object-fit: fill; display: block; z-index: 5;

    position: absolute; left: 28px; top: 96px; right: 28px; height: 704px;

    border-radius: 32px 32px 0 0; z-index: 0;
  }
  .mid-freeze {
    position: absolute; left: 0; top: 96px; width: 1280px; height: 704px;
    object-fit: fill; display: block; z-index: 2;
  }
  /* Wistia still — poster for video slot (static SSIM uses mid-freeze covering this region) */
  .video-poster {
    position: absolute; left: 50%; top: 455px; transform: translateX(-50%);
    width: 680px; aspect-ratio: 16/9; z-index: 1;
    object-fit: cover; border-radius: 16px; display: block;
    opacity: 0; /* mid-freeze owns pixels for SSIM; poster kept in DOM for sync */
  }
  /* Motion pack: content video — NOT sticky/hover; do not autoplay in SSIM capture */
  .motion-video {
    display: none;
  }
  .asset-bank { display: none; } /* slides/portrait for sync consumers */
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .cta {
    background: var(--accent); color: var(--navy); border-radius: var(--cta-radius);
    font-family: Assistant, AbsoluticaCon, sans-serif; font-size: 32px;
    box-shadow: var(--cta-shadow);
  }
  
  
.sb-freeze {
