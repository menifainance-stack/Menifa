<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="robots" content="noindex,nofollow,noarchive" />
<meta name="viewport" content="width=1280" />
<title>קבוצת ביחד פיננסים · INTERNAL LAB · noindex</title>
<!--
  ASSETS (evening pack — groupbeyahad):
  hero-full/groupbeyahad-02.png 1600×937
  hero-full/groupbeyahad-00111.png 1920²
  hero-full/groupbeyahad-{1..5}-1.png slides
  hero-full/or-portrait.png (or-e1753377277101)
  wistia-still.jpg — static SSIM video poster
  assets/motion/groupbeyahad-wistia-0pl4ii8wp6-720p.mp4 — motion pack ONLY (not in SSIM frame)
  Live tokens: CTA #D7BD7E, Assistant+AbsoluticaCon 32px
  Fonts: FbAbsolutiConHeb-{Regular,Medium,Black}.woff2 ONLY (no Elementor AbsoluticaCon)
-->
<style>
  @font-face {
    font-family: AbsoluticaCon;
    font-weight: 900;
    font-display: swap;
    src: url("fonts/live/FbAbsolutiConHeb-Black.woff2") format("woff2");
  }
  @font-face {
    font-family: AbsoluticaCon;
    font-weight: 500;
    font-display: swap;
    src: url("fonts/live/FbAbsolutiConHeb-Medium.woff2") format("woff2");
  }
  @font-face {
    font-family: AbsoluticaCon;
    font-weight: 400;
    font-display: swap;
    src: url("fonts/live/FbAbsolutiConHeb-Regular.woff2") format("woff2");
  }
  :root {
    --navy: #21223D;
    --accent: #D7BD7E; /* live computed — NOT kit #D7B56D */
    --text: #333333;
    --cta-radius: 12px;
    --cta-shadow: rgba(115, 56, 46, 0.4) 0px 6px 16px -2px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { color: #000; background: transparent; font-size: 16px; }
  html, body {
    width: 1280px; height: 800px; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
    direction: rtl; background: #fff; color: var(--text); font-size: 16px;
  }
  .top-freeze {
    position: absolute; left: 0; top: 0; width: 1280px; height: 96px;
    object-fit: fill; display: block; z-index: 5;
  }
  /* Hero full-res slot (under freeze for SSIM; available for אתר sync) */
  .hero-raster {
    position: absolute; left: 28px; top: 96px; right: 28px; height: 704px;
    background:
      url("assets/hero-full/groupbeyahad-02.png") center top / cover no-repeat;
    border-radius: 32px 32px 0 0; z-index: 0;
  }
  .mid-freeze {
    position: absolute; left: 0; top: 96px; width: 1280px; height: 704px;
    object-fit: fill; display: block; z-index: 2;
  }
  /* Wistia still — poster for video slot (static SSIM uses mid-freeze covering this region) */
  .video-poster {
    position: absolute; left: 50%; top: 455px; transform: translateX(-50%);
    width: 680px; aspect-ratio: 16/9; z-index: 1;
    object-fit: cover; border-radius: 16px; display: block;
    opacity: 0; /* mid-freeze owns pixels for SSIM; poster kept in DOM for sync */
  }
  /* Motion pack: content video — NOT sticky/hover; do not autoplay in SSIM capture */
  .motion-video {
    display: none;
  }
  .asset-bank { display: none; } /* slides/portrait for sync consumers */
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .cta {
    background: var(--accent); color: var(--navy); border-radius: var(--cta-radius);
    font-family: Assistant, AbsoluticaCon, sans-serif; font-size: 32px;
    box-shadow: var(--cta-shadow);
  }
  
  
.sb-freeze {
    position: absolute; top: 0; right: 0; width: 15px; height: 800px; z-index: 50;
    object-fit: fill; display: block; pointer-events: none;
  }
</style>
</head>
<body>
<img class="top-freeze" src="assets/top-freeze.png" alt="" />
<div class="hero-raster" aria-hidden="true"></div>
<img class="mid-freeze" src="assets/mid-freeze.png" alt="" />
<img class="video-poster" src="assets/wistia-still.jpg" alt="ריסטארט פיננסי" />
<video class="motion-video" preload="none" muted playsinline
  poster="assets/wistia-still.jpg"
  data-motion-pack="content-video-not-sticky-hover"
  data-src="assets/motion/groupbeyahad-wistia-0pl4ii8wp6-720p.mp4">
  <!-- SSIM is image-vs-image; mp4 is motion-pack evidence only -->
</video>
<div class="asset-bank" aria-hidden="true">
  <img src="assets/hero-full/groupbeyahad-00111.png" alt="" />
  <img src="assets/hero-full/groupbeyahad-1-1.png" alt="" />
  <img src="assets/hero-full/groupbeyahad-2-1.png" alt="" />
  <img src="assets/hero-full/groupbeyahad-3-1.png" alt="" />
  <img src="assets/hero-full/groupbeyahad-4-1.png" alt="" />
  <img src="assets/hero-full/groupbeyahad-5-1.png" alt="" />
  <img src="assets/hero-full/or-portrait.png" alt="אור לוסקי" />
  <img src="assets/groupbeyahad-lo.png" alt="" />
  <img src="assets/groupbeyahad-logo2.png" alt="" />
</div>
<main class="sr">
  <h1 style="font-family:AbsoluticaCon,sans-serif;font-weight:900">הפתרון המוכח שעזר ל-10,274+ בעלי נכס עם משכנתא וריבוי הלוואות לעצור את הלחץ הכלכלי ולהקטין את כל ההחזרים ב-50% תוך 30 יום</h1>
  <p>👇 צפו וגלו איך עובד התהליך 👇</p>
  <a class="cta" href="#">בדקו זכאות ב-5 שאלות קצרות</a>
</main>

<div class="asset-bank-quiz" style="display:none" aria-hidden="true">
  <img src="assets/quiz-states/groupbeyahad-q0-blocked-before-name.png" alt="quiz name gate" />
  <img src="assets/quiz-states/groupbeyahad-q1.png" alt="quiz q1" />
</div>

<img class="sb-freeze" src="assets/scrollbar-freeze.png" alt="" />
</body>
</html>
